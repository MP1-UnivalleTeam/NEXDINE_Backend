# Configuración del servidor
server.port=${PORT:8080}

# Configuración de Supabase PostgreSQL
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Sesiones para comunicación Frontend (Vercel) -> Backend (Render)
# En local se mantienen valores compatibles con HTTP.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
