server.port=${PORT:8080}

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:nexdine/productos}

app.imagen.max-bytes=${APP_IMAGEN_MAX_BYTES:5242880}

spring.servlet.multipart.max-file-size=${APP_IMAGEN_MAX_BYTES:5242880}

spring.servlet.multipart.max-request-size=${APP_IMAGEN_REQUEST_MAX_BYTES:6291456}