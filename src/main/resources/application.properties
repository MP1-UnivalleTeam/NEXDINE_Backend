server.port=${PORT:8080}

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:nexdine/productos}

app.imagen.max-bytes=${APP_IMAGEN_MAX_BYTES:5242880}
app.pedidos.tasa-impuesto=${APP_PEDIDOS_TASA_IMPUESTO:0}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=${STRIPE_CURRENCY:cop}
stripe.test-mode=${STRIPE_TEST_MODE:true}
stripe.deposit-percent=${STRIPE_DEPOSIT_PERCENT:30}
stripe.enabled=${STRIPE_ENABLED:false}

spring.servlet.multipart.max-file-size=${APP_IMAGEN_MAX_BYTES:5242880}

spring.servlet.multipart.max-request-size=${APP_IMAGEN_REQUEST_MAX_BYTES:6291456}

# Zona horaria del restaurante (recordatorios y horarios de servicio).
app.zona-horaria=${APP_ZONA_HORARIA:America/Bogota}

# Correo (facturas, reembolsos, avisos de estado y recordatorios).
# Se activa definiendo SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME
# y SPRING_MAIL_PASSWORD. Sin ellas el backend arranca y los envios responden 503.
app.correo.remitente=${APP_CORREO_REMITENTE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Un SMTP caido no debe marcar el backend como caido en el health check.
management.health.mail.enabled=false

# Swagger / OpenAPI: apagado por defecto para no publicar el mapa de la API.
# Para activarlo temporalmente en un entorno: SPRINGDOC_ENABLED=true
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
