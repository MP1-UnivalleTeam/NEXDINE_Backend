# ==========================================================
# PERFIL "local": SOLO PARA PROBAR EN ESTE EQUIPO
# ==========================================================
# Se activa únicamente con --spring.profiles.active=local (lo hace el
# script iniciar-local.ps1). Render y cualquier otro despliegue NO lo
# activan, así que siguen usando Supabase con sus variables de entorno.
#
# - Base de datos H2 en memoria: se crea al arrancar y se borra al cerrar.
#   Nunca toca la base de datos de Supabase.
# - Carga datos de demostración (db/local/semilla-local.sql).
# - Flyway desactivado: las tablas las crea Hibernate a partir de las entidades.

spring.datasource.url=jdbc:h2:mem:nexdine-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/local/semilla-local.sql
spring.sql.init.encoding=UTF-8

# Consecutivo de SKU con SQL estándar (H2 no soporta ON CONFLICT ... RETURNING).
app.sku.consecutivo-portable=true

# Frontend local (npm run dev).
CORS_ALLOWED_ORIGINS=http://localhost:5173
SESSION_COOKIE_SAME_SITE=lax
SESSION_COOKIE_SECURE=false

# Servicios externos apagados en local: Stripe, Cloudinary y correo.
stripe.enabled=false
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=
spring.mail.host=

# Swagger disponible en la prueba local: http://localhost:8080/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
